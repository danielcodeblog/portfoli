<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for advanced effects, gradients and drop shadows -->
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#FDFCF0"/>
      <stop offset="70%" stop-color="#EAD7B2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F211D" stop-opacity="0.08"/>
    </radialGradient>

    <!-- Warm Skin Gradients -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E3825"/>
      <stop offset="50%" stop-color="#4C2D1E"/>
      <stop offset="100%" stop-color="#3A2114"/>
    </linearGradient>
    
    <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#724630"/>
      <stop offset="100%" stop-color="#5E3825" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2114" stop-opacity="0"/>
      <stop offset="100%" stop-color="#21120B"/>
    </linearGradient>

    <!-- Cap Color Gradients -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E"/>
      <stop offset="50%" stop-color="#11362A"/>
      <stop offset="100%" stop-color="#0B211A"/>
    </linearGradient>
    
    <linearGradient id="capBrimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="100%" stop-color="#143D32"/>
    </linearGradient>

    <linearGradient id="capUnderBrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B7082"/>
      <stop offset="100%" stop-color="#2C4855"/>
    </linearGradient>

    <!-- Glasses Frame Style -->
    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#E2E8F0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="lensReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- AirPod Gradients -->
    <linearGradient id="airpodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F211D" flood-opacity="0.12"/>
    </filter>

    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Shirt Stripes Pattern -->
    <pattern id="shirtStripes" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#FDFDFD"/>
      <!-- Soft Vertical Stripe Texture -->
      <line x1="2" y1="0" x2="2" y2="16" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="#F1F5F9" stroke-width="1.2"/>
      <line x1="14" y1="0" x2="14" y2="16" stroke="#E2E8F0" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Aesthetic Portrait Card Frame -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" filter="url(#cardShadow)"/>
  
  <!-- Subtle circular brand glow behind head -->
  <circle cx="256" cy="240" r="170" fill="#D4FF3F" fill-opacity="0.05"/>
  <circle cx="256" cy="240" r="130" fill="#2D5A27" fill-opacity="0.04"/>

  <!-- PORTRAIT INNER ELEMENTS -->
  <g transform="translate(0, 5)">
    <!-- 1. BACK COLLAR / NECK SHIRT UNDERLAYER -->
    <path d="M 200,410 L 312,410 L 290,440 L 222,440 Z" fill="#E2E8F0"/>

    <!-- 2. NECK -->
    <!-- Neck Base Structure -->
    <path d="M 215,310 C 215,360 220,395 225,415 C 235,420 275,420 287,415 C 292,395 297,360 297,310 Z" fill="url(#skinBase)"/>
    <!-- Neck Highlight -->
    <path d="M 230,310 C 230,360 232,385 235,410 C 245,413 265,413 277,410 C 280,385 282,360 282,310 Z" fill="url(#skinHighlight)" opacity="0.3"/>
    <!-- Neck Shadow directly under Chin -->
    <path d="M 215,310 C 235,335 277,335 297,310 C 297,325 292,345 285,355 C 270,365 242,365 227,355 C 220,345 215,325 215,310 Z" fill="#21120B" opacity="0.65"/>

    <!-- 3. HEAD & FACE BASE -->
    <!-- Main Cranium/Jaw Shape -->
    <path d="M 175,190 C 175,120 200,115 256,115 C 312,115 337,120 337,190 C 337,245 315,315 256,315 C 197,315 175,245 175,190 Z" fill="url(#skinBase)"/>
    
    <!-- Face Highlights (Cheekbones, Forehead base, Nose ridge) -->
    <path d="M 190,190 C 190,140 210,135 256,135 C 302,135 322,140 322,190 C 322,235 305,295 256,295 C 207,295 190,235 190,190 Z" fill="url(#skinHighlight)" opacity="0.35"/>
    <path d="M 245,160 L 267,160 L 262,260 L 250,260 Z" fill="url(#skinHighlight)" opacity="0.25"/>

    <!-- Right and Left Ears -->
    <!-- Left Ear -->
    <path d="M 176,195 C 166,195 160,210 168,225 C 172,232 178,232 179,222 Z" fill="#4C2D1E"/>
    <path d="M 174,202 C 168,206 166,215 171,220" fill="none" stroke="#21120B" stroke-width="1.5"/>
    <!-- Right Ear -->
    <path d="M 336,195 C 346,195 352,210 344,225 C 340,232 334,232 333,222 Z" fill="#4C2D1E"/>
    <path d="M 338,202 C 344,206 346,215 341,220" fill="none" stroke="#21120B" stroke-width="1.5"/>

    <!-- AirPods (Precisely Styled matching his photo) -->
    <!-- Left AirPod (Left Ear perspective) -->
    <g filter="url(#elementShadow)">
      <!-- Pod Head -->
      <rect x="162" y="212" width="9" height="12" rx="4.5" fill="url(#airpodGrad)"/>
      <path d="M 166,213 C 163,213 161,216 161,219" fill="none" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Stem -->
      <path d="M 167,222 C 167,230 161,237 160,244" fill="none" stroke="url(#airpodGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Metallic Base / Mic Tip -->
      <line x1="160.5" y1="242" x2="159.5" y2="244" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Right AirPod (Right Ear perspective) -->
    <g filter="url(#elementShadow)">
      <!-- Pod Head -->
      <rect x="341" y="212" width="9" height="12" rx="4.5" fill="url(#airpodGrad)"/>
      <path d="M 342,213 C 345,213 347,216 347,219" fill="none" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Stem -->
      <path d="M 345,222 C 345,230 351,237 352,244" fill="none" stroke="url(#airpodGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Metallic Base / Mic Tip -->
      <line x1="351.5" y1="242" x2="352.5" y2="244" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- 4. FACIAL HAIR & FEATURES -->
    <!-- Confident Eyebrows -->
    <path d="M 205,178 Q 224,168 238,175" fill="none" stroke="#120D0A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 307,178 Q 288,168 274,175" fill="none" stroke="#120D0A" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Sharp Eyes -->
    <ellipse cx="223" cy="193" rx="10" ry="5.5" fill="#120D0A" opacity="0.15"/>
    <ellipse cx="289" cy="193" rx="10" ry="5.5" fill="#120D0A" opacity="0.15"/>
    
    <circle cx="224" cy="193" r="4.5" fill="#1A110B"/>
    <circle cx="288" cy="193" r="4.5" fill="#1A110B"/>
    
    <circle cx="225.5" cy="191.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="289.5" cy="191.5" r="1.5" fill="#FFFFFF"/>

    <!-- Nose (Minimalist lines representing highlights/shadows in photo) -->
    <path d="M 251,180 L 251,240 Q 251,248 256,248 Q 261,248 261,240" fill="none" stroke="#2D190E" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 244,244 C 246,249 266,249 268,244" fill="none" stroke="#2D190E" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mustache & Goatee -->
    <!-- Mustache -->
    <path d="M 230,263 Q 256,259 282,263" fill="none" stroke="#120D0A" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Subtle Lips (matching photo lips tone) -->
    <path d="M 231,270 Q 256,275 281,270" fill="none" stroke="#7A392F" stroke-width="5" stroke-linecap="round"/>
    <path d="M 235,270 Q 256,273 277,270" fill="none" stroke="#52221A" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Goatee on Chin -->
    <path d="M 234,279 C 238,284 246,299 256,299 C 266,299 274,284 278,279 C 274,284 266,287 256,287 C 246,287 238,284 234,279 Z" fill="#120D0A" opacity="0.95"/>
    <circle cx="256" cy="292" r="9" fill="#120D0A" opacity="0.85"/>

    <!-- 5. GLASSES (Premium Translucent Clear Frames) -->
    <g filter="url(#elementShadow)">
      <!-- Left Rim -->
      <circle cx="223" cy="195" r="23" fill="url(#lensReflect)"/>
      <circle cx="223" cy="195" r="23" fill="none" stroke="url(#glassesGrad)" stroke-width="3.5"/>
      <circle cx="223" cy="195" r="21" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.5"/>
      
      <!-- Right Rim -->
      <circle cx="289" cy="195" r="23" fill="url(#lensReflect)"/>
      <circle cx="289" cy="195" r="23" fill="none" stroke="url(#glassesGrad)" stroke-width="3.5"/>
      <circle cx="289" cy="195" r="21" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.5"/>
      
      <!-- Bridge -->
      <path d="M 246,191 Q 256,187 266,191" fill="none" stroke="url(#glassesGrad)" stroke-width="3.5" stroke-linecap="round"/>
      
      <!-- Side temple hinges -->
      <path d="M 200,195 H 178" fill="none" stroke="url(#glassesGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 312,195 H 334" fill="none" stroke="url(#glassesGrad)" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Clean lens diagonal glares -->
      <path d="M 210,182 L 222,174" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6"/>
      <path d="M 276,182 L 288,174" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6"/>
    </g>

    <!-- 6. THE CAP (Highly Styled Forest Green Athletic Cap) -->
    <!-- Cap dome -->
    <path d="M 183,122 C 178,52 334,52 329,122 Z" fill="url(#capGrad)" filter="url(#elementShadow)"/>
    
    <!-- UnderBrim Shadow on Forehead -->
    <path d="M 174,124 C 205,134 307,134 338,124 C 330,135 182,135 174,124 Z" fill="#0A1411" opacity="0.7"/>

    <!-- UnderBrim Edge (Blue/Grey accent layer from real cap structure in photo) -->
    <path d="M 166,122 C 202,109 310,109 346,122 C 342,126 332,128 322,128 C 290,123 222,123 190,128 C 180,128 170,126 166,122 Z" fill="url(#capUnderBrim)"/>

    <!-- Green Brim Overlayer -->
    <path d="M 158,122 C 200,103 312,103 354,122 C 348,131 334,134 316,133 C 285,123 227,123 196,133 C 178,134 164,131 158,122 Z" fill="url(#capBrimGrad)"/>
    
    <!-- Seamless brim border/stitch line -->
    <path d="M 164,120 C 201,105 311,105 348,120" fill="none" stroke="#D4FF3F" stroke-width="0.8" stroke-opacity="0.25"/>

    <!-- Cap Crown Seams & Eyelets -->
    <path d="M 256,50 L 256,110" stroke="#0F211D" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M 256,50 Q 212,65 204,115" fill="none" stroke="#0F211D" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M 256,50 Q 300,65 308,115" fill="none" stroke="#0F211D" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Metal eyelets -->
    <circle cx="225" cy="80" r="2" fill="#0A1411"/>
    <circle cx="287" cy="80" r="2" fill="#0A1411"/>

    <!-- Cap Monogram NY logo & Birds Embroidery Detail -->
    <!-- Center "NY" Letters -->
    <g transform="translate(256, 88)" text-anchor="middle">
      <!-- Outer Glow/Stitch -->
      <text y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round" letter-spacing="-1">NY</text>
      <text y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#120D0A" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" letter-spacing="-1">NY</text>
    </g>

    <!-- Embroidered Flying Birds (Doves/Eagles from the actual photo's beautiful cap!) -->
    <!-- Left flying bird -->
    <g transform="translate(212, 85) scale(0.65)">
      <!-- Silhouette of embroidered bird in white -->
      <path d="M 0,0 C -5,-10 -20,-10 -25,-12 C -20,-3 -10,1 -5,5 C -8,12 -5,16 -2,12 C 1,9 5,4 8,0 C 3,-1 1,-1 0,0 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
      <path d="M -12,-11 Q -8,-6 -5,5" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </g>
    <!-- Right flying bird -->
    <g transform="translate(300, 85) scale(0.65) scale(-1, 1)">
      <!-- Silhouette of embroidered bird in white -->
      <path d="M 0,0 C -5,-10 -20,-10 -25,-12 C -20,-3 -10,1 -5,5 C -8,12 -5,16 -2,12 C 1,9 5,4 8,0 C 3,-1 1,-1 0,0 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
      <path d="M -12,-11 Q -8,-6 -5,5" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </g>

    <!-- Top Cap Button -->
    <ellipse cx="256" cy="50" rx="6" ry="3.5" fill="#143D32" stroke="#2D5A27" stroke-width="1"/>

    <!-- 8. SMART EXQUISITE SHIRT -->
    <!-- Body Shoulders (matching texture/shape in photo) -->
    <path d="M 120,440 C 140,405 180,390 220,395 L 292,395 C 332,390 372,405 392,440 C 395,450 395,500 395,512 L 117,512 C 117,500 117,450 120,440 Z" fill="url(#shirtStripes)" filter="url(#elementShadow)"/>
    
    <!-- Collars (Left & Right Folded Overly Elegant) -->
    <!-- Left Collar -->
    <path d="M 220,395 L 180,455 L 225,480 L 244,420 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#elementShadow)"/>
    <!-- Collar Fold Stitch line -->
    <path d="M 220,395 L 182,451" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="205" y1="410" x2="201" y2="445" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- Right Collar -->
    <path d="M 292,395 L 332,455 L 287,480 L 268,420 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#elementShadow)"/>
    <!-- Collar Fold Stitch line -->
    <path d="M 292,395 L 330,451" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="307" y1="410" x2="311" y2="445" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- Inner V-Neck Exposure of Skin & Stripe Shadow -->
    <path d="M 244,420 L 256,445 L 268,420 Z" fill="url(#skinShadow)"/>
    <path d="M 244,420 L 256,450 L 268,420" fill="none" stroke="#21120B" stroke-width="1.5" opacity="0.3"/>

    <!-- Buttons Panel Line & Premium Buttons -->
    <line x1="256" y1="450" x2="256" y2="512" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <!-- Elegant buttons -->
    <circle cx="256" cy="478" r="4.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="256" cy="478" r="1.5" fill="#94A3B8"/>
    <circle cx="256" cy="508" r="4.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="256" cy="508" r="1.5" fill="#94A3B8"/>
  </g>
  
  <!-- Outer Technical Framelines Overlay and Logo Badge -->
  <rect x="16" y="16" width="480" height="480" rx="36" fill="none" stroke="#D4FF3F" stroke-width="1.5" stroke-opacity="0.15"/>
  <rect x="24" y="24" width="464" height="464" rx="28" fill="none" stroke="#2D5A27" stroke-width="1.5" stroke-opacity="0.1"/>

  <!-- Logo/Initials Badge -->
  <g transform="translate(450, 450)" filter="url(#elementShadow)">
    <circle cx="0" cy="0" r="22" fill="#0F211D" stroke="#D4FF3F" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="13" fill="#D4FF3F" text-anchor="middle">DS</text>
  </g>
</svg>
